<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spiritual Growth Plan Assessment</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, hsl(0, 100%, 89%) 0%, lab(73.06% 38.18 16.54) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header::before {
            content: '♥';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            margin-top: 20px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .question-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .question-number {
            color: var(--category-color);
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .category {
            background: var(--category-bg);
            color: var(--category-color);
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .question {
            font-size: 1.3rem;
            line-height: 1.6;
            color: #333;
            margin-bottom: 10px;
        }

        .question-detail {
            font-size: 1rem;
            color: #666;
            font-style: italic;
            margin-bottom: 30px;
        }

        .rating-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            position: relative;
            height: 80px;
        }

        .slider-wrapper {
            position: relative;
            width: 320px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .rating-slider {
            width: 100%;
            margin: 0;
            background: transparent;
            position: absolute;
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            z-index: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 3px;
            background: #e0e0e0;
        }

        .rating-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--category-color, #e91e63);
            border: 3px solid var(--category-color, #e91e63);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .rating-slider::-moz-range-thumb {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--category-color, #e91e63);
            border: 3px solid var(--category-color, #e91e63);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .rating-slider::-ms-thumb {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--category-color, #e91e63);
            border: 3px solid var(--category-color, #e91e63);
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .slider-thumb {
            position: absolute;
            top: 50%;
            left: 0;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: transparent;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 2;
            border: none;
            /* Remove background and border so only the number shows */
        }

        @media (max-width: 600px) {
            .slider-wrapper {
                width: 200px;
            }
            .slider-thumb, .rating-slider::-webkit-slider-thumb, .rating-slider::-moz-range-thumb, .rating-slider::-ms-thumb {
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }
        }

        .rating-labels {
            display: flex;
            justify-content: space-between;
            margin-bottom: 40px;
            font-size: 0.9rem;
            color: #666;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--category-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--category-color-dark);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #666;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-bar {
            background: #f0f0f0;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .progress-fill {
            background: linear-gradient(90deg, var(--category-color), var(--category-color-dark));
            height: 100%;
            transition: width 0.5s ease;
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .result-category {
            background: var(--category-bg);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid var(--category-color);
        }

        .result-category h3 {
            color: var(--category-color);
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        .result-score {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 0;
        }

        .result-level {
            padding: 5px 15px;
            border-radius: 20px;
            color: white;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 0;
            font-size: 0.8rem;
        }

        .poor { background: #ff6b6b; }
        .fair { background: #ffa726; }
        .good { background: #66bb6a; }
        .very-good { background: #42a5f5; }
        .outstanding { background: #ab47bc; }

        .restart-btn {
            display: block;
            margin: 30px auto 0;
            padding: 15px 40px;
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            background: #cc0000;
            transform: translateY(-2px);
        }

        /* Category color variables */
        .category-0 {
            --category-color: #e91e63;
            --category-color-dark: #c2185b;
            --category-bg: #fce4ec;
        }

        .category-1 {
            --category-color: #2196f3;
            --category-color-dark: #1976d2;
            --category-bg: #e3f2fd;
        }

        .category-2 {
            --category-color: #4caf50;
            --category-color-dark: #388e3c;
            --category-bg: #e8f5e8;
        }

        .category-3 {
            --category-color: #ff9800;
            --category-color-dark: #f57c00;
            --category-bg: #fff3e0;
        }

        .category-4 {
            --category-color: #9c27b0;
            --category-color-dark: #7b1fa2;
            --category-bg: #f3e5f5;
        }

        @media (max-width: 600px) {
            .rating-container {
                gap: 10px;
            }
            
            .rating-button {
                width: 50px;
                height: 50px;
                font-size: 1rem;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
        }

        .slider-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }

        .rating-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .rating-slider:hover {
            opacity: 1;
        }

        .slider-thumb {
            position: absolute;
            top: -8px;
            left: 0;
            width: 30px;
            height: 30px;
            background: var(--category-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: transform 0.3s ease;
        }

        .slider-wrapper:hover .slider-thumb {
            transform: scale(1.2);
        }

        .accordion {
            border-radius: 15px;
            margin-bottom: 20px;
            overflow: hidden;
            border-left: 5px solid var(--category-color);
            background: var(--category-bg);
            transition: box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px;
            cursor: pointer;
            background: var(--category-bg);
        }

        .accordion-header h3 {
            margin: 0;
            color: var(--category-color);
            font-size: 1.2rem;
        }

        .accordion-summary {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    width: 100%;
}

.accordion-score-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    min-width: 90px;
}

.result-score {
    font-size: 2rem;

}

    color: white;
    font-weight: 600;

        .result-score {

            padding: 5px 15px;

        }

        .accordion.open .accordion-content {

        }

  .go-deeper-link {
    color: var(--category-color);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    transition: color 0.2s;
}
.go-deeper-link:hover {
    color: var(--category-color-dark);
}

        .steps-btn {
            display: block;
            margin: 20px auto 0;
            padding: 15px 40px;
            background: #2196f3;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            transition: background 0.3s, transform 0.3s;
        }

        .steps-btn:hover {
            background: #1976d2;
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .results-actions {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
}

@media (max-width: 600px) {
    .results-actions {
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Spiritual Growth Plan</h1>
            <p>A journey of discovery to become God's best version of you</p>
        </div>

        <div class="content">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <div id="questionSection">
                <div class="question-container">
                    <div class="question-number" id="questionNumber"></div>
                    <div class="category" id="categoryName"></div>
                    <div class="question" id="questionText"></div>
                    <div class="question-detail" id="questionDetail"></div>
                </div>

                <div class="rating-container" id="ratingContainer">
                    <div class="slider-wrapper">
                        <input type="range" min="0" max="5" value="0" class="rating-slider" id="ratingSlider">
                        <div class="slider-thumb" id="sliderThumb">0</div>
                    </div>
                </div>

                <div class="rating-labels">
                    <span>Strongly Disagree</span>
                    <span>Strongly Agree</span>
                </div>

                <div class="controls">
                    <button class="btn btn-secondary" id="prevBtn" onclick="previousQuestion()">Previous</button>
                    <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()" disabled>Next</button>
                </div>
            </div>

            <div class="results" id="results">
                <h2 style="text-align: center; margin-bottom: 30px; color: #333;">Your Spiritual Growth Assessment Results</h2>
                <div id="resultsContainer"></div>
                <div class="results-actions">
                    <button class="restart-btn" onclick="restartAssessment()">Take Assessment Again</button>
                    <a href="https://kingfisher.org.uk" target="_blank" class="steps-btn">Steps to Change</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            {
                category: "Connecting with the family of God",
                questions: [
                    {
                        text: "I am intentionally cultivating relationships with Christian friends and spiritual mentors",
                        detail: "I identify Christians who have character qualities I admire, and spend time with them"
                    },
                    {
                        text: "I am cultivating authentic community by speaking the truth in love and creating healthy boundaries",
                        detail: "I don't just opt for the quiet life - I say what needs to be said, but in a loving, up building way"
                    },
                    {
                        text: "I am increasingly becoming loving, grace-giving and forgiving to others",
                        detail: "When people annoy me, I am increasingly able to respond calmly and positively"
                    },
                    {
                        text: "I am authentically connecting in my immediate family relationships (spouse, children, siblings)",
                        detail: "Though we can't get on with everyone, so far as it is down to me I am seeking to build honest, positive relationships"
                    },
                    {
                        text: "I am resolving conflict with others in a Biblical manner and supporting the leadership of this church family",
                        detail: "Whether in my personal family, or in the family of the church, I am increasingly refusing to cause division through gossip, mud-slinging or character assassination"
                    }
                ]
            },
            {
                category: "Maturing in my spiritual life",
                questions: [
                    {
                        text: "I am growing spiritually through regular quiet times, reading God's word and praying",
                        detail: ""
                    },
                    {
                        text: "I avoid addictive behaviours that hinder my growth",
                        detail: "Food, busyness, tv etc. Though these things, in themselves are not wrong, am I using them as a means of avoiding sorting out real issues in my life?"
                    },
                    {
                        text: "I have an active relationship with one or several people that encourage me in my spiritual walk",
                        detail: "People to whom I make myself open and accountable"
                    },
                    {
                        text: "I am experiencing an increase of the Fruit of the Spirit in my life (love, joy, peace, patience, kindness, goodness, gentleness and self control - Galatians 5:22-23)",
                        detail: ""
                    },
                    {
                        text: "I am honouring God with my finances and, therefore, tithing to the church (giving 10%)",
                        detail: ""
                    }
                ]
            },
            {
                category: "Discovering my ministry in the church",
                questions: [
                    {
                        text: "I have discovered how God has made me (Discovery) and am actively seeking to develop that in ministry",
                        detail: ""
                    },
                    {
                        text: "I am actively demonstrating that I am Christ's servant in ordinary ways",
                        detail: "In my attitudes towards family, friends, church, work etc"
                    },
                    {
                        text: "I am serving in a regular ministry in the church body",
                        detail: ""
                    },
                    {
                        text: "I am taking the opportunities presented in the church regarding courses and gatherings for support of my ministry",
                        detail: ""
                    },
                    {
                        text: "I am an active, participating member of my Connect group",
                        detail: ""
                    }
                ]
            },
            {
                category: "Growing in my sense of mission in the world",
                questions: [
                    {
                        text: "I am actively praying for and cultivating relationships with unchurched friends and family",
                        detail: ""
                    },
                    {
                        text: "I am actively witnessing to spiritual seekers",
                        detail: "Through telling my story, or through inviting them to church, or to other Christian events or introducing them to other Christians, or some other means"
                    },
                    {
                        text: "I am praying for God to show me where he can use me in the world in which I live",
                        detail: ""
                    },
                    {
                        text: "I am actively looking for and taking opportunities to build positively into other peoples' lives",
                        detail: "I am looking for ways of demonstrating Christ's love through words and acts of kindness to those who don't yet know him"
                    },
                    {
                        text: "I am known by others as one who lives out their beliefs in their everyday life",
                        detail: ""
                    }
                ]
            },
            {
                category: "Deepening my relationship with God in worship",
                questions: [
                    {
                        text: "I am faithfully attending corporate worship services at my church with an attitude of positive expectation that God will meet with me",
                        detail: ""
                    },
                    {
                        text: "I am actively seeking to know and do what pleases God as a way of life",
                        detail: ""
                    },
                    {
                        text: "I am surrendering my whole life to the Lord, including the area of exercise and nutrition (Romans 12: 1)",
                        detail: "The way I treat my body, soul and spirit reflects my belief that they were created by, and belong to God"
                    },
                    {
                        text: "The worship songs that I sing accurately and increasingly reflect my true feelings about God",
                        detail: ""
                    },
                    {
                        text: "I am honouring God with every dimension of my life by balancing His purposes in my life",
                        detail: "Am increasingly demonstrating that I see the importance of all five of these areas being in proper balance"
                    }
                ]
            }
        ];

        let currentQuestionIndex = 0;
        let answers = [];
        let totalQuestions = 0;

        // Calculate total questions
        questions.forEach(category => {
            totalQuestions += category.questions.length;
        });

        function getCurrentQuestion() {
            let questionCount = 0;
            for (let categoryIndex = 0; categoryIndex < questions.length; categoryIndex++) {
                const category = questions[categoryIndex];
                if (questionCount + category.questions.length > currentQuestionIndex) {
                    const questionInCategory = currentQuestionIndex - questionCount;
                    return {
                        category: category.category,
                        question: category.questions[questionInCategory],
                        categoryIndex: categoryIndex,
                        questionIndex: questionInCategory
                    };
                }
                questionCount += category.questions.length;
            }
        }

        function displayQuestion() {
            const current = getCurrentQuestion();

            document.body.className = `category-${current.categoryIndex}`;

            document.getElementById('questionNumber').textContent = `Question ${currentQuestionIndex + 1} of ${totalQuestions}`;
            document.getElementById('categoryName').textContent = current.category;
            document.getElementById('questionText').textContent = current.question.text;
            document.getElementById('questionDetail').textContent = current.question.detail;

            // Update progress bar
            const progress = ((currentQuestionIndex + 1) / totalQuestions) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // Set slider value
            const slider = document.getElementById('ratingSlider');
            const thumb = document.getElementById('sliderThumb');
            slider.value = answers[currentQuestionIndex] !== undefined ? answers[currentQuestionIndex] : 0;
            thumb.textContent = slider.value;

            // Position thumb
            updateSliderThumb();

            // Update button states
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            document.getElementById('nextBtn').disabled = answers[currentQuestionIndex] === undefined;

            if (currentQuestionIndex === totalQuestions - 1) {
                document.getElementById('nextBtn').textContent = 'View Results';
            } else {
                document.getElementById('nextBtn').textContent = 'Next';
            }
        }

        function selectRating(value) {
            answers[currentQuestionIndex] = value;

            // Update UI
            document.getElementById('ratingSlider').value = value;
            document.getElementById('sliderThumb').textContent = value;
            updateSliderThumb();

            // Enable next button
            document.getElementById('nextBtn').disabled = false;
        }

        function updateSliderThumb() {
            const slider = document.getElementById('ratingSlider');
            const thumb = document.getElementById('sliderThumb');
            const min = parseInt(slider.min);
            const max = parseInt(slider.max);
            const val = parseInt(slider.value);

            // Calculate position
            const percent = (val - min) / (max - min);
            const sliderWidth = slider.offsetWidth;
            const thumbWidth = thumb.offsetWidth;
            // Position so the center of .slider-thumb matches the center of the native thumb
            const left = percent * (sliderWidth - thumbWidth) + thumbWidth / 2;

            thumb.style.left = `${left}px`;
            thumb.style.top = '50%';
            thumb.style.transform = 'translate(-50%, -50%)';
        }

        function nextQuestion() {
            if (currentQuestionIndex < totalQuestions - 1) {
                currentQuestionIndex++;
                displayQuestion();
            } else {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                displayQuestion();
            }
        }

        function getScoreLevel(score) {
            if (score <= 5) return { level: 'Poor', class: 'poor' };
            if (score <= 10) return { level: 'Fair', class: 'fair' };
            if (score <= 15) return { level: 'Good', class: 'good' };
            if (score <= 20) return { level: 'Very Good', class: 'very-good' };
            return { level: 'Outstanding', class: 'outstanding' };
        }

       function showResults() {
    document.getElementById('questionSection').style.display = 'none';
    document.getElementById('results').classList.add('show');
    document.body.className = '';

    const resultsContainer = document.getElementById('resultsContainer');
    resultsContainer.innerHTML = '';

    let answerIndex = 0;

    // Go deeper content for each category
    const goDeeperContent = [
        `<p>
           The book of Romans is a great starting point for advice on how to connect with the family of God. If you have 5 minutes spare read Romans 12 as it speaks so clearly into these topics!<br><br>
            If you want to go even further into studying it we have a great Bible study series available called <em>Romans: The Real Truth of Christianity</em>; ask your connect group leader if you would like a copy.
        </p>`,
        `<p>
            You can read the bible anywhere with the YouVersion Bible app. It has reading plans and it can even read it to you! Goto <a href="https://bible.com" target="_blank">bible.com</a> for more information.<br><br>
            <a href="https://thebibleproject.com" target="_blank">Thebibleproject.com</a> is a great resource for developing a deeper understanding of the bible and how it all fits together. The videos are simple and quick so it’s a great starting point.<br><br>
            We believe in the principle of tithing which is how church gets most of it’s funding. If you don’t know much about tithing then ask one of the leaders at church or watch a talk by James Burn called <a href=https://youtube.com/live/6DldkL6PSbs">“Giving as an act of Faith”</a> on YouTube<br>
            If you decide that you would like to tithe then visit the <a href="https://kingfisher.org.uk/giving">giving page</a> on our website for all the information..
        </p>`,
        `<p>
            Do you want to get involved but have no idea where you would be most effective at serving?<br><br>
            We have a tool called “Discovery” at Kingfisher Church which is like a questionnaire which helps you figure out how God has wired you up as a person and what areas of ministry you may suit serving in. Ollie or James will look through the finished questionnaire and advise on what ministries will be a great fit for you to get involved in!<br>
            <br>Ask your connect group leader or any leader at church for more information or to get a copy of Discovery.
        </p>`,
        `<p>
            Commit to one specific person in your life that you could be praying that they will start a journey to faith in God. Think of that person as your “Plus One” to invite along to church.<br><br>
            As well as finding where you can serve in Church, there are plenty of opportunities to serve in different ways in the social enterprise that grew out of our church.
        </p>`,
        `<p>
            Try listening to more worship music throughout the week. Journeys in the car can become opportunities for times of worship and prayer so that time is useful!<br><br>
            Find us on Spotify for <a href="https://open.spotify.com/artist/3yoodHEVUlWji9CvxLVvFb?si=lH98tpijQ7yHeleZgfBoWQ">Kingfisher Church</a> songs as well as playlists of worship music that we will either be singing at church or that we think will be encouraging to listen to.
        </p>`
    ];

    questions.forEach((category, categoryIndex) => {
        let categoryScore = 0;
        for (let i = 0; i < category.questions.length; i++) {
            categoryScore += answers[answerIndex + i];
        }
        const scoreInfo = getScoreLevel(categoryScore);

        // Accordion HTML
        const accordionDiv = document.createElement('div');
        accordionDiv.className = `accordion category-${categoryIndex}`;

        accordionDiv.innerHTML = `
            <div class="accordion-header">
                <div class="accordion-summary">
                    <div>
                        <h3>${category.category}</h3>
                        <a href="#" class="go-deeper-link" data-acc-index="${categoryIndex}" style="font-style:italic; font-size:0.95rem; display:block; margin-top:6px;">Go deeper</a>
                    </div>
                    <div class="accordion-score-block">
                        <div class="result-score">${categoryScore} / 25</div>
                        <div class="result-level ${scoreInfo.class}">${scoreInfo.level}</div>
                    </div>
                </div>
            </div>
            <div class="accordion-content">
                ${goDeeperContent[categoryIndex]}
            </div>
        `;
        resultsContainer.appendChild(accordionDiv);

        answerIndex += category.questions.length;
    });

    // Add accordion open/close logic
    document.querySelectorAll('.go-deeper-link').forEach(link => {
        link.onclick = function(e) {
            e.preventDefault();
            const acc = link.closest('.accordion');
            acc.classList.toggle('open');
        };
    });
}

        function restartAssessment() {
            currentQuestionIndex = 0;
            answers = [];
            document.getElementById('results').classList.remove('show');
            document.getElementById('questionSection').style.display = 'block';
            displayQuestion();
        }

        // Event listeners
        document.getElementById('ratingContainer').addEventListener('click', function(e) {
            if (e.target.classList.contains('rating-button')) {
                selectRating(parseInt(e.target.dataset.value));
            }
        });

        const slider = document.getElementById('ratingSlider');
        const sliderThumb = document.getElementById('sliderThumb');

        slider.addEventListener('input', function() {
            const value = this.value;
            sliderThumb.textContent = value;
            selectRating(parseInt(value));
        });

        // Initialize
        displayQuestion();
    </script>
</body>
</html>
